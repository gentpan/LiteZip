name: macOS build and core tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core integration and security tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Universal release build (unsigned)
        run: Scripts/build.sh
      - name: Package development build
        run: ditto -c -k --sequesterRsrc --keepParent build/LiteZip.app build/LiteZip-unsigned.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LiteZip-macOS-universal-unsigned
          path: build/LiteZip-unsigned.zip
